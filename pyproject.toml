[project]
name = "ather-skyguard"
version = "0.1.0"
description = "ATHER (SkyGuard AI) — 5-Layer Anomaly Detection Prototype for Automatic Weather Stations (SIH 2026)"
authors = [
    { name = "ATHER Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "metpy>=1.5.0",
    "pyod>=2.0.0",
    "mapie>=0.8.0",
    "shap>=0.44.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
